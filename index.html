<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>プライバシーポリシーの移転 / Privacy Policy moved | Shred Snap</title>
    <link rel="canonical" href="https://shredsnap.app/privacy-policy/">
    <script>
      const target = new URL("https://shredsnap.app/privacy-policy/");
      const requested = new URLSearchParams(location.search).get("lang");
      const anchor = location.hash.slice(1).toLowerCase();
      const language = ["ja", "en"].includes(requested) ? requested
        : ["ja", "en"].includes(anchor) ? anchor : null;
      if (language) target.searchParams.set("lang", language);
      location.replace(target.href);
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=https://shredsnap.app/privacy-policy/"></noscript>
  </head>
  <body>
    <h1>プライバシーポリシーの移転 / Privacy Policy moved</h1>
    <p>Shred Snapのプライバシーポリシー・免責事項は新しいページへ移転しました。</p>
    <p>The Shred Snap Privacy Policy and Disclaimer have moved.</p>
    <p><a href="https://shredsnap.app/privacy-policy/?lang=ja" lang="ja">日本語</a> / <a href="https://shredsnap.app/privacy-policy/?lang=en" lang="en">English</a></p>
  </body>
</html>
